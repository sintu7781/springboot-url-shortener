version: "3.9"

services:

  postgres:

    image: postgres:latest

    container_name: url-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:

    image: redis:latest

    container_name: url-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:

  postgres-data:

  redis-data:
