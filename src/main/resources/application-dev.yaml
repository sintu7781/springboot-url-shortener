spring:

  datasource:
    url: jdbc:postgresql://localhost:5432/url_shortener?options=-c%20TimeZone%3DUTC
    username: postgres
    password: postgres

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  
  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

logging:
  level:
    root: DEBUG