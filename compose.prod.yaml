services:

  app:
    image: url-shortener:local

    ports:
      - "8080:8080"

    mem_limit: 768m

    cpus: "1.0"

    environment:
      SPRING_PROFILES_ACTIVE: prod

      JAVA_TOOL_OPYIONS: "-XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=25"

      DB_URL: jdbc:postgresql://postgres:5432/url_shortener
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    restart: unless-stopped

    stop_grace_period: 40s

  postgres:

    image: postgres:17.6

    mem_limit: 1g

    cpus: "1.0"

    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d url_shortener"]

      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    volumes:
      - postgres-prod-data:/var/lib/postgresql/data

  redis:

    image: redis:8.4.0

    mem_limit: 512m

    cpus: "0.5"

    command:
      - redis-server
      - --appendonly
      - "yes"

    healthcheck:
      test: ["CMD-SHELL", "redis-cli", "ping"]

      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    volumes:
      - redis-prod-data:/data

volumes:

  postgres-prod-data:

  redis-prod-data:
